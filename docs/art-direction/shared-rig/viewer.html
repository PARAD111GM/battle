<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Rivetfall · Shared rig study</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e7e2; color: #262a2d; font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 1200px; margin: 0 auto; padding: 28px 28px 24px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 15px; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.025em; }
    header p { margin: 0; color: #626969; font-size: 13px; }
    #stage { position: relative; width: 100%; height: min(67vw, 660px); min-height: 360px; overflow: hidden; border: 1px solid #d1d2ce; border-radius: 8px; background: #eeede8; }
    #stage canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #status { position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; padding: 12px 16px; width: max-content; max-width: calc(100% - 32px); background: rgba(248, 248, 245, .95); border: 1px solid #d1d2ce; border-radius: 6px; text-align: center; }
    #status:empty { display: none; }
    #view-label { position: absolute; left: 18px; top: 15px; margin: 0; color: #596063; font-size: 12px; letter-spacing: .055em; text-transform: uppercase; pointer-events: none; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
    button, select { min-height: 36px; border: 1px solid #bfc4c3; border-radius: 5px; padding: 6px 11px; background: #f7f7f3; color: #262a2d; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover, select:hover { background: #fff; border-color: #929c9c; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #2c696b; outline-offset: 3px; }
    button:disabled, select:disabled, input:disabled { opacity: .45; cursor: wait; }
    button[aria-pressed="true"] { background: #d7e2df; border-color: #80948d; }
    .toolbar label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
    .toolbar .spacer { flex: 1; }
    #timeline { width: 100%; margin: 16px 0 0; accent-color: #39736e; }
    footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 10px; color: #626969; font-size: 12px; }
    footer p { margin: 0; }
    @media (max-width: 600px) {
      main { padding: 17px 12px; }
      header { align-items: flex-start; flex-direction: column; gap: 3px; }
      h1 { font-size: 20px; }
      #stage { min-height: 380px; }
      .toolbar { gap: 8px; }
      .toolbar .spacer { display: none; }
      footer { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Mr. Midnight &amp; Brick Barrage</h1>
      <p>Shared rig · Run cycle</p>
    </header>
    <section id="stage" aria-label="Interactive 3D character comparison">
      <p id="view-label">Three-quarter view</p>
      <p id="status" role="status">Loading character models…</p>
    </section>
    <div class="toolbar" aria-label="Animation and camera controls">
      <button id="play" type="button" disabled>Pause</button>
      <label for="speed">Speed
        <select id="speed" disabled>
          <option value="0.5">½×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1½×</option>
        </select>
      </label>
      <label><input id="bones" type="checkbox" disabled> Show rig</label>
      <span class="spacer"></span>
      <button id="side" type="button" disabled>Side</button>
      <button id="front" type="button" disabled>Front</button>
      <button id="reset" type="button" disabled>Reset view</button>
    </div>
    <input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="Animation position" disabled>
    <footer>
      <p>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
      <p id="details">Local 3D preview</p>
    </footer>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
