<div class="controls"><button id="play" type="button" aria-pressed="true">Pause</button><label>Speed <select id="speed" aria-label="Playback speed"><option value="0.5">Half speed</option><option value="1" selected>Normal</option><option value="1.5">1.5×</option></select></label><button id="direction" type="button">Face left</button><label class="scrub">Frame <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub run cycle"></label></div>

<script>
(() => {
'use strict';
const CYCLE=.8, TAU=Math.PI*2, FLOOR=547, X=482;
const state={time:0,phase:0,speed:1,facing:1,paused:matchMedia('(prefers-reduced-motion: reduce)').matches};
const el=id=>document.getElementById(id), rad=degrees=>degrees*Math.PI/180;
const fmt=n=>Number(n.toFixed(4));
const translate=(id,x,y,angle=0)=>el(id).setAttribute('transform',`translate(${fmt(x)} ${fmt(y)}) rotate(${fmt(angle)})`);
const rotate=(x,y,a)=>({x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)});
const bone=(id,a,b)=>translate(id,a.x,a.y,Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI-90);
const cubic=(a,b,c,d,t)=>a*(1-t)**3+3*b*t*(1-t)**2+3*c*t*t*(1-t)+d*t**3;
const smooth=t=>t*t*(3-2*t);
function foot(p){
 const stance=p<.38;
 let x,y,angle;
 if(stance){const t=p/.38;x=64-128*t;angle=t<.27?-12*(1-smooth(t/.27)):t>.7?29*smooth((t-.7)/.3):0;
  const r=rad(angle);y=FLOOR-Math.max(-20*Math.sin(r)+15*Math.cos(r),39*Math.sin(r)+15*Math.cos(r));
 }else{const t=(p-.38)/.62;x=cubic(-64,-134,134,64,t);angle=t<.2?29+16*smooth(t/.2):45-57*smooth((t-.2)/.8);
  const r=rad(angle);y=FLOOR-Math.max(-20*Math.sin(r)+15*Math.cos(r),39*Math.sin(r)+15*Math.cos(r))-89*Math.sin(Math.PI*t)**1.15;
 }
 return {x:X+x,y,angle,stance};
}
function leg(prefix,hip,target){
 const upper=86,lower=87,dx=target.x-hip.x,dy=target.y-hip.y;
 const distance=Math.max(.001,Math.min(upper+lower-.01,Math.hypot(dx,dy)));
 const bearing=Math.atan2(dy,dx),along=(upper*upper-lower*lower+distance*distance)/(2*distance),height=Math.sqrt(Math.max(0,upper*upper-along*along));
 const knee={x:hip.x+Math.cos(bearing)*along+Math.sin(bearing)*height,y:hip.y+Math.sin(bearing)*along-Math.cos(bearing)*height};
 bone(prefix+'-thigh',hip,knee);bone(prefix+'-shin',knee,target);translate(prefix+'-foot',target.x,target.y,target.angle);
 return {hip,knee,foot:target};
}
function render(seconds){
 state.time=Number.isFinite(seconds)?Math.max(0,seconds):0;
 const p=(state.time%CYCLE)/CYCLE,a=p*TAU;
 state.phase=p;
 const bob=8*Math.sin(a*2), hip={x:X,y:386+bob};
 const lean=9+1.8*Math.sin(a*2-.6), tilt=rad(lean);
 const world=(x,y)=>{const v=rotate(x,y,tilt);return {x:hip.x+v.x,y:hip.y+v.y}};
 const near=foot(p),far=foot((p+.5)%1);
 const farLeg=leg('far',{x:hip.x-9,y:hip.y+2},far);
 translate('jacket-tails',hip.x,hip.y,lean);
 const lag=Math.sin(a*2-1.1)*5;
 el('back-tail').setAttribute('d',`M-29-43L-15-28-9 8-28 23Q${-44-lag} 18 ${-58-lag} 25L-43-4Z`);
 el('front-tail').setAttribute('d',`M7-33L25-24 29 17 10 29-2 10Z`);
 const nearLeg=leg('near',{x:hip.x+7,y:hip.y},near);
 translate('torso',hip.x,hip.y,lean);
 const neck=world(3,-109);
 translate('head',neck.x,neck.y-bob*.5,-lean*.45+Math.sin(a*2-.3)*.8);
 const hair=Math.sin(a*2-1.4)*3;
 el('hair-back').setAttribute('d',`M-26-65Q-47-50-36-22L${-45-hair} -7-25-12 ${-31-hair} 5-8-4 12-28 2-72Z`);
 const tie=Math.sin(a*2-1)*2.5;
 el('tie').setAttribute('d',`M-2-86L4-85 ${12+tie}-52 ${7+tie}-41 ${tie}-50Z`);
 const backShoulder=world(-26,-93),backSwing=.68*Math.cos(a);
 const backElbow={x:backShoulder.x+Math.sin(backSwing)*54,y:backShoulder.y+Math.cos(backSwing)*54};
 const backWrist={x:backElbow.x+Math.sin(backSwing+1.18)*47,y:backElbow.y+Math.cos(backSwing+1.18)*47};
 bone('far-arm-upper',backShoulder,backElbow);bone('far-arm-lower',backElbow,backWrist);
 const shoulder=world(28,-93),swing=-.34*Math.cos(a);
 const elbow={x:shoulder.x+Math.sin(swing)*50,y:shoulder.y+Math.cos(swing)*50};
 const wrist={x:elbow.x+40,y:elbow.y+22+Math.sin(a-.5)*3};
 bone('near-arm-upper',shoulder,elbow);bone('near-arm-lower',elbow,wrist);translate('armed-hand',wrist.x,wrist.y,38+3*Math.sin(a-.4));
 el('orientation').setAttribute('transform',`translate(${X} 0) scale(${state.facing} 1) translate(${-X} 0)`);
 for(const [name,target] of [['near',near],['far',far]]){el('contact-'+name).setAttribute('cx',fmt(X+(target.x-X)*state.facing+9*state.facing));el('contact-'+name).setAttribute('opacity',target.stance?'.19':'0')}
 el('floor-shadow').setAttribute('rx',fmt(80+bob*.7));el('floor-shadow').setAttribute('opacity',fmt(.13+bob*.002));
 el('ground-track').setAttribute('stroke-dashoffset',fmt(p*336*state.facing));
 el('scrub').value=String(Math.round(p*1000));
 window.__MIDNIGHT__.metrics={near:nearLeg,far:farLeg,hip,wrist,lean};
}
function sync(){el('play').textContent=state.paused?'Play':'Pause';el('play').setAttribute('aria-pressed',String(!state.paused));el('speed').value=String(state.speed);el('direction').textContent=state.facing===1?'Face left':'Face right';}
function pause(){state.paused=true;sync()}
function play(){state.paused=false;sync()}
function setSpeed(value){if(Number.isFinite(value)&&value>0&&value<=4)state.speed=value;sync()}
function setFacing(value){state.facing=value<0?-1:1;render(state.time);sync()}
window.__MIDNIGHT__={render,pause,play,setSpeed,setFacing,getState:()=>({...state,duration:CYCLE}),metrics:null};
el('play').onclick=()=>state.paused?play():pause();el('speed').onchange=e=>setSpeed(Number(e.target.value));el('direction').onclick=()=>setFacing(-state.facing);el('scrub').oninput=e=>{pause();render(Number(e.target.value)/1000*CYCLE)};
document.addEventListener('keydown',event=>{if(event.code==='Space'&&!event.repeat&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){event.preventDefault();state.paused?play():pause()}});
let previous=performance.now();function frame(now){const dt=Math.min(.1,(now-previous)/1000);previous=now;if(!state.paused)render(state.time+dt*state.speed);requestAnimationFrame(frame)}
render(0);sync();requestAnimationFrame(frame);
})();
</script>
